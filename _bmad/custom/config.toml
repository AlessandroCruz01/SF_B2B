# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#
# [agents.bmad-agent-pm]
# description = "Prefers short, bulleted PRDs over narrative drafts."

# A documentacao gerada por workflows (bmad-document-project e afins) vive em
# docs/project/, junto do site docsify e do state file project-scan-report.json.
# Sem este pin, project_knowledge resolve para docs/ e os workflows nao encontram
# o state file (perdem a retomada) e escrevem os documentos na raiz de docs/.
[modules.bmm]
project_knowledge = "{project-root}/docs/project"
