            onchild2click={child2ButtonClickHandler}></c-child-component>
    </div>
    <div>
        [PARENT]
        Message From Child:
        <strong>{messageChild}</strong>
    </div>
    <div>
        [PARENT]
        Message From Child 2:
        <strong>{messageChild2}</strong>
    </div>
</template>
